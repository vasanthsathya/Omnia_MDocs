site_name: BE Networks Verity Documentation
site_url: https://docs.be-net.com
site_description: Documentation for BE Networks Verity network management platform
site_author: BE Networks

# Repository
repo_url: https://github.com/BE-Network/docs
repo_name: BE-Network/docs

# Copyright
copyright: Copyright &copy; BE Networks

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Plugins
plugins:
  - search
  - mkdocs-glightbox
  - mkdocs-macros-plugin
  - mkdocs-redirects
  - mkdocs-with-pdf
  - mkdocs-swagger-ui-tag
  - mike:
      version_selector: true
      css_dir: stylesheets

# Extensions
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

